</style></head><body><main><header><h1>내 이름 또박또박</h1><details><summary>⚙ 설정</summary><div class="settings"><label><input id="vibe" type="checkbox">진동 알림</label><label><input id="sound" type="checkbox" checked>소리 켜기</label><label><input id="guide" type="checkbox" checked>점선·획순 번호</label><div class="group"><button type="button" id="testG">기역 듣기</button><button type="button" id="testN">니은 듣기</button></div><p class="note" id="speechNote">받침은 이름을, 다른 글자 부분은 띵 소리를 들려줘요.</p><p class="note" id="vibeNote"></p><p class="note">각 글자의 1번부터 점선과 화살표를 따라 그려요. 획순을 자동으로 평가하지 않아요.</p></div></details></header><section class="toolbar" aria-label="학생과 활동 선택"><div class="group students" id="students"></div><div class="group"><button id="touchmode" class="active" aria-pressed="true">✋ 만져 보기</button><button id="writemode" aria-pressed="false">✏️ 따라 쓰기</button><button id="finalmode" aria-pressed="false">✍️ 받침만 쓰기</button></div></section><section class="board"><div class="board-head"><div class="letters" id="letters" aria-label="연습할 글자"></div><div class="actions"><button id="reset">↺ 다시</button><button id="fullscreen">화면 크게</button></div></div><div class="canvas-wrap"><canvas id="canvas" aria-label="이름을 만져 보고 따라 그리는 영역"></canvas></div><div class="feedback" id="message" aria-live="polite"></div><div class="status" id="status"></div></section></main><script>
const names=['박준서','최하윤','오지안'];let student=0,selected=-1,mode='touch',drawing=false,pointer=null,prev=null,ink=[],lastSignal=0,lastWarn=0,hit=null,audio;const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),mask=document.createElement('canvas'),mc=mask.getContext('2d'),message=document.querySelector('#message');let W=1000,H=440,boxes=[];

const jamo={

'ㄴ':[[[12,12],[12,88],[88,88]]],
'ㅂ':[[[15,10],[15,90]],[[85,10],[85,90]],[[15,48],[85,48]],[[15,90],[85,90]]],

'ㅎ':[[[38,5],[62,5]],[[12,27],[88,27]],ellipse(50,69,30,23)],
'ㅏ':[[[35,8],[35,92]],[[35,50],[90,50]]],
'ㅓ':[[[10,50],[65,50]],[[65,8],[65,92]]],

const combine=(...parts)=>parts.flat();
const glyphPaths={
'박':combine(part('ㅂ',8,8,44,52),part('ㅏ',61,5,29,57),part('ㄱ',15,73,72,20)),
'준':combine(part('ㅈ',16,6,68,35),part('ㅜ',9,45,82,21),part('ㄴ',16,74,69,19)),
'서':combine(part('ㅅ',8,12,48,77),part('ㅓ',58,7,34,85)),
'최':combine(part('ㅊ',10,8,55,46),part('ㅗ',7,59,61,28),part('ㅣ',73,6,20,88)),
'하':combine(part('ㅎ',7,10,49,78),part('ㅏ',61,7,31,86)),
'윤':combine(part('ㅇ',25,5,50,34),part('ㅠ',10,45,80,23),part('ㄴ',16,76,69,18)),
'오':combine(part('ㅇ',20,6,60,48),part('ㅗ',10,62,80,27)),
'지':combine(part('ㅈ',8,14,49,72),part('ㅣ',69,6,23,88)),
'안':combine(part('ㅇ',8,9,48,49),part('ㅏ',62,5,29,57),part('ㄴ',16,74,69,19))

let layoutPaths=[];

function guides(){if((mode!=='write'&&mode!=='final')||!document.querySelector('#guide').checked)return;for(let k=0;k<layoutPaths.length;k++){let {paths,size}=layoutPaths[k];for(let i=0;i<paths.length;i++){if(mode==='final'&&(!hasFinal(boxes[k].ch)||i!==paths.length-1))continue;let path=paths[i],r=Math.max(9,size*.033),[x,y]=path[0];stroke(ctx,path,'#609578',Math.max(2,size*.008),true);let tip=path.length>10?path.length-8:path.length-1,end=path[tip],before=path[tip-1],angle=Math.atan2(end[1]-before[1],end[0]-before[0]),len=size*.025;ctx.save();ctx.strokeStyle='#47745b';ctx.lineWidth=Math.max(2,size*.007);ctx.beginPath();ctx.moveTo(end[0]-len*Math.cos(angle-.6),end[1]-len*Math.sin(angle-.6));ctx.lineTo(...end);ctx.lineTo(end[0]-len*Math.cos(angle+.6),end[1]-len*Math.sin(angle+.6));ctx.stroke();ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.strokeStyle='#3c795a';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#285e43';ctx.font=`700 ${Math.max(12,size*.044)}px system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(mode==='final'?1:i+1),x,y+.5);ctx.restore()}}}
function hasFinal(ch){let n=ch.charCodeAt(0)-0xac00;return n>=0&&n<11172&&n%28!==0}function buildMask(){mask.width=W;mask.height=H;glyphs(mc,true)}function render(){ctx.clearRect(0,0,W,H);glyphs(ctx);guides();if(hit){ctx.fillStyle='#eea545';ctx.beginPath();ctx.arc(hit[0],hit[1],24,0,Math.PI*2);ctx.fill()}ctx.save();if(mode==='final'){ctx.beginPath();for(let k=0;k<layoutPaths.length;k++){if(!hasFinal(boxes[k].ch))continue;let {paths,size}=layoutPaths[k],path=paths[paths.length-1],r=size*.042;for(let i=1;i<path.length;i++){let a=path[i-1],b=path[i],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy),nx=-dy/len*r,ny=dx/len*r;ctx.moveTo(a[0]+nx,a[1]+ny);ctx.lineTo(a[0]-nx,a[1]-ny);ctx.lineTo(b[0]-nx,b[1]-ny);ctx.lineTo(b[0]+nx,b[1]+ny);ctx.closePath()}for(let [x,y]of path){ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,Math.PI*2)}}ctx.clip()}ctx.strokeStyle='#287554';ctx.lineWidth=Math.max(10,H*.028);ctx.lineCap='round';ctx.lineJoin='round';for(let path of ink){if(!path.length)continue;ctx.beginPath();ctx.moveTo(...path[0]);if(path.length===1)ctx.lineTo(path[0][0]+.1,path[0][1]);else path.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke()}ctx.restore()}
function resize(){let r=c.parentElement.getBoundingClientRect(),oldW=W,oldH=H;W=Math.max(1,Math.round(r.width));H=Math.max(1,Math.round(r.height));ink=ink.map(path=>path.map(([x,y])=>[x*W/oldW,y*H/oldH]));c.width=W;c.height=H;buildMask();render()}function reset(){if(mode==='final'&&selected>=0&&!hasFinal(names[student][selected]))selected=-1;stopSpeech();lastSpokenKey=null;lastSpokenAt=-Infinity;drawing=false;pointer=null;prev=null;ink=[];hit=null;info(mode==='touch'?'이름 아래의 받침을 만져 보세요.':mode==='final'?'아래 받침의 1번부터 점선을 따라 써요.':'각 글자의 1번부터 점선을 따라 써요.');buildMask();render();controls()}

function signal(warn=false){let now=Date.now();if(now-lastSignal<550)return;lastSignal=now;if(document.querySelector('#vibe').checked&&navigator.vibrate)navigator.vibrate(warn?70:45);if(document.querySelector('#sound').checked){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=warn?380:520;g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch{}}}
const finalNames={1:{letter:'ㄱ',name:'기역'},4:{letter:'ㄴ',name:'니은'}};
let spokenContact=null,lastSpokenKey=null,lastSpokenAt=-Infinity,speechSerial=0;
function segmentDistance(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],d=dx*dx+dy*dy;const t=d?Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/d)):0;return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function finalAt(p){let best=null,bestD=Infinity;for(let i=0;i<boxes.length;i++){let box=boxes[i],meta=finalNames[(box.ch.charCodeAt(0)-0xac00)%28];if(!meta)continue;let group=layoutPaths[i],path=group.paths[group.paths.length-1],d=Infinity;for(let j=1;j<path.length;j++)d=Math.min(d,segmentDistance(p,path[j-1],path[j]));if(d<=group.size*.042+Math.max(5,group.size*.02)&&d<bestD){bestD=d;best={...meta,key:student+':'+selected+':'+i}}}return best}
